target-version = "py311"
line-length = 100

[lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "RET", "RUF"]

[lint.per-file-ignores]
# Pydantic schemas mirror the camelCase JSON contract the frontend expects.
# Renaming to snake_case would require `alias=` on every field and risk drift.
"app/schemas/*" = ["N815"]
